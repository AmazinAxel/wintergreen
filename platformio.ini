[platformio]
default_envs = esp32c3
src_dir = platforms/esp32

[env:esp32c3]
platform  = espressif32 @ ^7.0.1
board     = esp32-c3-devkitm-1
framework = espidf
extra_scripts = pre:tools/generate_assets.py

; flash
board_build.partitions    = platforms/esp32/default_16MB.csv
board_build.flash_size    = 16MB
; The real SPI mode comes from CONFIG_ESPTOOLPY_FLASHMODE_* in sdkconfig.defaults,
; not from here — this key is inert under the espidf framework. QIO does not boot
; on the X4; see the note in sdkconfig.defaults.
board_build.flash_mode    = dio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
upload_speed              = 921600

; serial monitor
monitor_speed  = 115200
monitor_rts    = 0
monitor_dtr    = 0
monitor_filters = esp32_exception_decoder

build_flags = -Ilib -Wno-format-truncation
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; Fast iteration: same firmware without the embedded reader font. Flash a full
; esp32c3 build once first so the font partition is populated.
[env:esp32c3-dev]
extends    = env:esp32c3
build_flags = -Ilib -Wno-format-truncation -DWG_NO_EMBED_FONT

; pio run -e esp32c3-qemu
[env:esp32c3-qemu]
platform  = espressif32 @ ^7.0.1
board     = esp32-c3-devkitm-1
framework = espidf

board_build.partitions    = platforms/esp32/default_qemu.csv
board_build.flash_size    = 16MB
board_build.flash_mode    = dio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags = -Ilib -DQEMU_BUILD

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu"
