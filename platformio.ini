[platformio]
default_envs = esp32c3
src_dir = platforms/esp32

[env:esp32c3]
platform  = espressif32 @ ^7.0.1
board     = esp32-c3-devkitm-1
framework = espidf
extra_scripts = pre:tools/generate_assets.py

; flash
board_build.partitions    = platforms/esp32/default_16MB.csv
board_build.flash_size    = 16MB
board_build.flash_mode    = dio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
upload_speed              = 921600



; ---- remove me -----
monitor_speed  = 115200
monitor_rts    = 0
monitor_dtr    = 0
monitor_filters = esp32_exception_decoder

build_flags = -Wno-format-truncation
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
